name: Data integrity tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Tk libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run file-based regressions
        run: python -m unittest discover -s tests -v

  windows-package:
    name: Windows EXE build and smoke
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install runtime and packager
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build both GUI entry points
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name excel-merge 合并脚本.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name excel-split 拆分脚本.py
      - name: Smoke-test packaged entry points
        shell: pwsh
        run: |
          $mergeVersion = & .\dist\excel-merge.exe --version
          if ($LASTEXITCODE -ne 0 -or $mergeVersion -notmatch '1\.7') { throw "Merge EXE smoke failed: $mergeVersion" }
          $splitVersion = & .\dist\excel-split.exe --version
          if ($LASTEXITCODE -ne 0 -or $splitVersion -notmatch '1\.7') { throw "Split EXE smoke failed: $splitVersion" }
